[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "game-performance-diagnostic-timeline"
version = "0.1.0"
description = "Windows game performance and log evidence timeline demo"
requires-python = ">=3.12"
dependencies = [
  "psutil==7.2.2",
]

[project.scripts]
game-diagnostic-cli = "game_diag.cli:main"

[project.gui-scripts]
game-diagnostic-demo = "game_diag.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
